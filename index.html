<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SP!</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1E2743">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #FFFFFF;
      font-family: 'Poppins', sans-serif;
      overscroll-behavior-y: none;
      -webkit-overscroll-behavior: none;
    }
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    #pwaBarBottom {
      display: none;
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 28px);
      max-width: 400px;
      background: #202124;
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 99998;
      align-items: center;
      justify-content: space-between;
      animation: subirBarra 0.35s ease-out;
    }
    @keyframes subirBarra {
      from { transform: translate(-50%, 40px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
    .bar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .bar-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      object-fit: cover;
    }
    .bar-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #ffffff;
      margin: 0;
      line-height: 1.2;
    }
    .bar-sub {
      font-size: 11px;
      color: #9aa0a6;
      margin: 0;
    }
    .bar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-bar-install {
      background: #8ab4f8;
      color: #202124;
      border: none;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      padding: 7px 14px;
      border-radius: 20px;
    }
    .btn-bar-close {
      background: transparent;
      color: #9aa0a6;
      border: none;
      font-size: 16px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
    }
