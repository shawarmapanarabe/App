<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SP!</title>
  
  <meta name="theme-color" content="#1E2743">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SP!">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1yo4GNS2jeYfQC9-ZCTCbS13K-SxG-T91">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
  
  <script>
    var qInit = window.location.search;
    var esApple = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (!esApple || !qInit || qInit.length < 4) {
      var mLink = document.createElement('link');
      mLink.rel = 'manifest';
      mLink.href = './manifest.json';
      document.head.appendChild(mLink);
    }
  </script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: #FFFFFF; font-family: 'Poppins', sans-serif;
      overscroll-behavior-y: none; -webkit-overscroll-behavior: none;
    }
    iframe { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      border: 0; display: block; background-color: #F9F9F9; 
    }

    /* CONTENEDOR WHATSAPP ARRASTRABLE */
    #btnWaFlotante {
      position: fixed;
      top: clamp(200px, 57vw, 242px);
      left: calc(50% + min(50vw, 215px) - 58px);
      z-index: 99990;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      cursor: grab;
      -webkit-tap-highlight-color: transparent;
    }
    #btnWaFlotante:active {
      cursor: grabbing;
    }

    /* BURBUJA VERDE PALPITANTE PERMANENTE */
    .burbuja-wa-inner {
      width: 100%;
      height: 100%;
      background: #25D366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.45);
      border: 2px solid #ffffff;
      animation: palpitarWa 1.5s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .burbuja-wa-inner svg {
      width: 25px;
      height: 25px;
      fill: #ffffff;
    }
    @keyframes palpitarWa {
      0% {
        transform: scale(1);
        box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
      }
      100% {
        transform: scale(1.1);
        box-shadow: 0 6px 18px rgba(37, 211, 102, 0.7);
      }
    }

    /* PANTALLA DE CARGA */
    #splashScreen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: #FFFFFF; z-index: 999999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
      pointer-events: none;
    }
    .splash-logo {
      width: 66vw;
      max-width: 290px;
      height: auto;
      aspect-ratio: 1/1;
      border-radius: 0;
      object-fit: contain;
      box-shadow: none;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
      margin-top: -24px;
      animation: palpitarLogo 1.4s ease-in-out infinite alternate;
    }
    @keyframes palpitarLogo {
      0% { transform: scale(1); }
      100% { transform: scale(1.03); }
    }

    /* BARRA INFERIOR */
    #pwaBarBottom {
      display: none; position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 32px); max-width: 380px; background: #1E2743; color: #ffffff;
      padding: 10px 14px; border-radius: 16px; box-shadow: 0 8px 24px rgba(30, 39, 67, 0.4);
      z-index: 99998; align-items: center; justify-content: space-between;
      animation: subirBarra 0.35s ease-out; border: 1px solid rgba(255, 255, 255, 0.12);
    }
    @keyframes subirBarra {
      from { transform: translate(-50%, 40px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
    .bar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .bar-icon { width: 38px; height: 38px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
    .bar-text-group { min-width: 0; }
    .bar-title { 
      font-size: 13px; font-weight: 700; color: #ffffff; margin: 0; line-height: 1.2; 
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
    }
    .bar-sub { font-size: 11px; color: #F2B647; margin: 0; font-weight: 500; }
    .bar-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    
    .btn-bar-save { 
      background: #E95042; color: #ffffff; border: none; font-size: 12px; 
      font-weight: 700; cursor: pointer; padding: 7px 15px; border-radius: 20px; 
      font-family: 'Poppins', sans-serif; transition: transform 0.1s ease;
    }
    .btn-bar-save:active { transform: scale(0.95); }
    .btn-bar-close { background: transparent; color: #9aa0a6; border: none; font-size: 16px; cursor: pointer; padding: 4px; line-height: 1; }

    /* MODAL DE GUÍA IOS */
    #iosGuideModal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(30, 39, 67, 0.72); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
      z-index: 99999; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-card {
      background: #ffffff; color: #1E2743; width: 90%; max-width: 310px;
      border-radius: 24px; padding: 24px 20px 20px 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      text-align: center; animation: zoomModal 0.22s ease-out;
    }
    @keyframes zoomModal {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-logo {
      width: 76px; height: 76px; border-radius: 0; margin: 0 auto 12px auto;
      display: block; object-fit: contain;
    }
    .modal-title { 
      font-family: 'Unbounded', sans-serif; font-size: 15px; font-weight: 800; 
      color: #1E2743; margin: 0 0 16px 0; letter-spacing: -0.3px; line-height: 1.3;
    }
    .modal-instruction {
      background: #F9F9F9; border-radius: 16px; padding: 14px 16px; margin: 0 0 18px 0;
      text-align: center; font-size: 13px; color: #334155; line-height: 1.6; border: 1px solid #eef0f2;
    }
    .icon-inline {
      display: inline-flex; align-items: center; justify-content: center;
      vertical-align: middle; margin: 0 2px;
    }
    .modal-btn-ok {
      width: 100%; background: #E95042; color: #ffffff; border: none;
      padding: 13px; border-radius: 14px; font-family: 'Poppins', sans-serif;
      font-weight: 700; font-size: 13.5px; cursor: pointer; transition: transform 0.1s ease;
      box-shadow: 0 4px 12px rgba(233, 80, 66, 0.25);
    }
    .modal-btn-ok:active { transform: scale(0.96); }
  </style>
</head>
<body>

  <!-- BOTÓN FLOTANTE WHATSAPP IMANTADO A LOS BORDES -->
  <div id="btnWaFlotante" aria-label="WhatsApp">
    <div class="burbuja-wa-inner">
      <svg viewBox="0 0 24 24">
        <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.312.045-.634.053-1.045-.084-.285-.094-.657-.22-1.134-.429-1.993-.865-3.298-2.888-3.399-3.023-.1-.135-.808-1.077-.808-2.053 0-.976.512-1.455.694-1.654.182-.198.396-.247.528-.247.132 0 .264.002.379.008.121.006.284-.046.444.339.165.396.561 1.369.61 1.469.05.099.083.215.017.347-.066.132-.099.215-.198.33-.099.115-.208.257-.297.345-.102.1-.21.21-.09.417.12.207.534.882 1.144 1.425.786.7 1.448.918 1.655 1.02.207.102.33.085.452-.056.122-.14.528-.614.668-.825.14-.21.28-.175.471-.105.19.07 1.216.574 1.425.679.209.105.347.157.397.245.05.088.05.514-.094.919z"/>
      </svg>
    </div>
  </div>

  <!-- PANTALLA SPLASH -->
  <div id="splashScreen">
    <img src="https://lh3.googleusercontent.com/d/1yo4GNS2jeYfQC9-ZCTCbS13K-SxG-T91" class="splash-logo" alt="Shawarma Panárabe">
  </div>

  <iframe 
    id="appFrame" 
    name="appFrame" 
    src="" 
    allow="downloads; clipboard-write" 
  ></iframe>

  <!-- BARRA INFERIOR -->
  <div id="pwaBarBottom">
    <div class="bar-left">
      <img src="https://lh3.googleusercontent.com/d/1yo4GNS2jeYfQC9-ZCTCbS13K-SxG-T91" class="bar-icon" alt="SP!">
      <div class="bar-text-group">
        <p class="bar-title">Guardar Tarjeta</p>
        <p class="bar-sub">Acceso directo a tu saldo</p>
      </div>
    </div>
    <div class="bar-right">
      <button class="btn-bar-save" id="btnBarInstall">Guardar</button>
      <button class="btn-bar-close" onclick="cerrarBarra()">✕</button>
    </div>
  </div>

  <!-- GUÍA DE GUARDADO RÁPIDO PUNTUAL -->
  <div id="iosGuideModal">
    <div class="modal-card">
      <img src="https://lh3.googleusercontent.com/d/1yo4GNS2jeYfQC9-ZCTCbS13K-SxG-T91" class="modal-logo" alt="Shawarma Panárabe">
      <h3 class="modal-title">Guardar Tarjeta</h3>
      
      <div class="modal-instruction">
        En tu navegador, toca los tres puntos <b style="letter-spacing:1px;">•••</b>, elige <b>Compartir</b> 
        <span class="icon-inline">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1E2743" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
            <polyline points="16 6 12 2 8 6"></polyline>
            <line x1="12" y1="2" x2="12" y2="15"></line>
          </svg>
        </span>, 
        baja y busca <b>"Agregar a inicio"</b>.
      </div>
      
      <button class="modal-btn-ok" onclick="cerrarGuiaIos()">¡Entendido!</button>
    </div>
  </div>

  <script>
    var urlBase = "https://script.google.com/macros/s/AKfycbzQUgbqTUXLNHNpmufsJx_MYkkZdxa27kUmfNmP9fF5QsL3XuoQZWBn2_UCfVOU9RfEPQ/exec";
    var query = window.location.search;

    if (query && (query.indexOf('pin=') !== -1 || query.indexOf('search=') !== -1 || query.length > 5)) {
      if (query.indexOf('search=') === -1 && query.indexOf('action=') === -1) {
        query = '?search=' + query.substring(1);
      }
      try { 
        localStorage.setItem('panarabe_final_query', query); 
        sessionStorage.setItem('panarabe_session_query', query);
      } catch(e) {}
    } else {
      try {
        var guardado = localStorage.getItem('panarabe_final_query') || sessionStorage.getItem('panarabe_session_query');
        if (guardado) query = guardado;
      } catch(e) {}
    }

    var frame = document.getElementById("appFrame");
    frame.src = urlBase + (query ? query : "");

    // TIEMPO DE SPLASH: 2.8s EN IPHONE, 1.4s EN ANDROID
    var tiempoSplash = esApple ? 2800 : 1400;

    setTimeout(function() {
      var splash = document.getElementById("splashScreen");
      if (splash) {
        splash.style.opacity = "0";
        setTimeout(function() {
          splash.style.display = "none";
        }, 400);
      }
    }, tiempoSplash);

    // LÓGICA DE ARRASTRE CON IMÁN A LOS LATERALES
    (function() {
      var btn = document.getElementById('btnWaFlotante');
      if (!btn) return;

      var isDragging = false;
      var hasMoved = false;
      var startX, startY;
      var initialLeft, initialTop;

      function startDrag(e) {
        var touch = e.touches ? e.touches[0] : e;
        isDragging = true;
        hasMoved = false;
        startX = touch.clientX;
        startY = touch.clientY;

        var rect = btn.getBoundingClientRect();
        initialLeft = rect.left;
        initialTop = rect.top;

        btn.style.left = initialLeft + 'px';
        btn.style.top = initialTop + 'px';
        btn.style.margin = '0';
        btn.style.transition = 'none'; // Quitar transición durante el arrastre
      }

      function onDrag(e) {
        if (!isDragging) return;
        var touch = e.touches ? e.touches[0] : e;
        var deltaX = touch.clientX - startX;
        var deltaY = touch.clientY - startY;

        if (Math.abs(deltaX) > 5 || Math.abs(deltaY) > 5) {
          hasMoved = true;
        }

        var newLeft = initialLeft + deltaX;
        var newTop = initialTop + deltaY;

        // Limitar dentro de la pantalla
        var maxLeft = window.innerWidth - btn.offsetWidth - 12;
        var maxTop = window.innerHeight - btn.offsetHeight - 80; // No tapar barra inferior

        newLeft = Math.max(12, Math.min(newLeft, maxLeft));
        newTop = Math.max(70, Math.min(newTop, maxTop)); // No tapar barra superior

        btn.style.left = newLeft + 'px';
        btn.style.top = newTop + 'px';
      }

      function stopDrag() {
        if (!isDragging) return;
        isDragging = false;

        if (!hasMoved) {
          // Clic limpio: abrir WhatsApp nativo
          window.location.href = 'whatsapp://send?phone=51906769744';
        } else {
          // EFECTO IMÁN: pegar al lateral más cercano
          btn.style.transition = 'left 0.25s cubic-bezier(0.25, 1, 0.5, 1)';
          var centroPantalla = window.innerWidth / 2;
          var rect = btn.getBoundingClientRect();

          if ((rect.left + rect.width / 2) < centroPantalla) {
            btn.style.left = '12px'; // Imantado a la izquierda
          } else {
            btn.style.left = (window.innerWidth - btn.offsetWidth - 12) + 'px'; // Imantado a la derecha
          }
        }
      }

      btn.addEventListener('touchstart', startDrag, { passive: false });
      window.addEventListener('touchmove', onDrag, { passive: false });
      window.addEventListener('touchend', stopDrag);

      btn.addEventListener('mousedown', startDrag);
      window.addEventListener('mousemove', onDrag);
      window.addEventListener('mouseup', stopDrag);
    })();

    frame.onload = function() {
      try {
        var iframeDoc = frame.contentDocument || frame.contentWindow.document;
        var pinInput = iframeDoc.getElementById('inputPin');
        var btnIngresar = iframeDoc.getElementById('btnBuscar');
        
        if (pinInput && btnIngresar && query && query.indexOf('pin=') !== -1) {
          var matchPin = query.match(/pin=([^&]+)/i);
          if (matchPin && matchPin[1]) {
            var pinVal = decodeURIComponent(matchPin[1]);
            pinInput.value = pinVal;
            pinInput.dispatchEvent(new Event('input', { bubbles: true }));
            setTimeout(function() {
              btnIngresar.click();
            }, 150);
          }
        }
      } catch(err) {}
    };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').catch(function(){});
      });
    }

    var esPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

    if (!esPWA) {
      var barra = document.getElementById('pwaBarBottom');
      var btnInstalar = document.getElementById('btnBarInstall');

      if (esApple) {
        setTimeout(function() {
          barra.style.display = 'flex';
        }, 1200);

        btnInstalar.onclick = function() {
          document.getElementById('iosGuideModal').style.display = 'flex';
        };
      } else {
        var promptDiferido;
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          promptDiferido = e;
          barra.style.display = 'flex';

          btnInstalar.onclick = function() {
            if (promptDiferido) {
              promptDiferido.prompt();
              promptDiferido.userChoice.then(function(choice) {
                if (choice.outcome === 'accepted') {
                  barra.style.display = 'none';
                }
                promptDiferido = null;
              });
            }
          };
        });
      }
    }

    function cerrarBarra() {
      document.getElementById('pwaBarBottom').style.display = 'none';
    }

    function cerrarGuiaIos() {
      document.getElementById('iosGuideModal').style.display = 'none';
      document.getElementById('pwaBarBottom').style.display = 'none';
    }

    window.addEventListener('appinstalled', function() {
      document.getElementById('pwaBarBottom').style.display = 'none';
    });
  </script>
</body>
</html>
