  <script>
    var qInit = window.location.search;
    var esApple = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var esPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

    if (esApple && esPWA) {
      document.documentElement.classList.add('is-apple-installed');
    }

    if (esApple && !esPWA) {
      document.documentElement.classList.add('is-apple-web');
    }

    if (!esApple || !qInit || qInit.length < 4) {
      var mLink = document.createElement('link');
      mLink.rel = 'manifest';
      mLink.href = './manifest.json';
      document.head.appendChild(mLink);
    }
  </script>

  <style>
    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: #FFFFFF; font-family: 'Poppins', sans-serif;
      overscroll-behavior-y: none; -webkit-overscroll-behavior: none;
    }

    iframe { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      border: 0; display: block; background-color: #F9F9F9; 
    }

    html.is-apple-installed iframe {
      top: env(safe-area-inset-top, 0px) !important;
      height: calc(100% - env(safe-area-inset-top, 0px)) !important;
    }

    #iosTopBar {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: #FFFFFF;
      z-index: 99990;
    }
    html.is-apple-installed #iosTopBar {
      display: block;
      height: env(safe-area-inset-top, 0px);
    }

    #btnWaFlotante {
      display: flex;
      position: fixed;
      top: clamp(282px, 78vw, 335px);
      left: calc(50% + min(50vw, 215px) - 58px);
      z-index: 99990;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      text-decoration: none;
      transition: transform 0.28s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.28s ease, left 0.28s ease;
    }

    html.is-apple-web #btnWaFlotante {
      top: clamp(248px, 68vw, 305px);
    }

    html.is-apple-installed #btnWaFlotante {
      top: calc(clamp(282px, 78vw, 335px) + env(safe-area-inset-top, 0px));
    }

    #btnWaFlotante.docked-edge {
      left: calc(100% - 24px) !important;
      opacity: 0.65;
      transform: scale(0.92);
    }
    #btnWaFlotante.docked-edge:hover,
    #btnWaFlotante.docked-edge:active {
      opacity: 0.95;
    }

    .burbuja-wa-inner {
      width: 100%;
      height: 100%;
      background: #25D366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.45);
      border: 2px solid #ffffff;
      animation: palpitarWa 1.5s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .burbuja-wa-inner svg {
      width: 26px;
      height: 26px;
      fill: #ffffff;
    }
    @keyframes palpitarWa {
      0% { transform: scale(1); box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4); }
      100% { transform: scale(1.1); box-shadow: 0 6px 18px rgba(37, 211, 102, 0.7); }
    }

    /* PANTALLA SPLASH */
    #splashScreen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: #FFFFFF; z-index: 999999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.4s ease-out;
      pointer-events: none;
    }

    .splash-logo {
      width: 82vw;
      max-width: 360px;
      height: auto;
      aspect-ratio: 1 / 1;
      border-radius: 0;
      object-fit: contain;
      box-shadow: none;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
      margin-top: 0;
      animation: entrarYpalpitar 1.4s ease-in-out infinite alternate;
    }

    @keyframes entrarYpalpitar {
      0% { transform: scale(0.97); }
      100% { transform: scale(1.025); }
    }

    /* PÍLDORA NOTIFICACIONES IOS */
    #iosPushPill {
      display: none;
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      left: 50%;
      transform: translateX(-50%);
      background: #1E2743;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 700;
      z-index: 99995;
      box-shadow: 0 6px 18px rgba(30, 39, 67, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      align-items: center;
      gap: 6px;
      animation: bajarPildora 0.3s ease-out;
    }
    @keyframes bajarPildora {
      from { transform: translate(-50%, -30px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }

    /* BARRA INFERIOR */
    #pwaBarBottom {
      display: none; position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 32px); max-width: 380px; background: #1E2743; color: #ffffff;
      padding: 10px 14px; border-radius: 16px; box-shadow: 0 8px 24px rgba(30, 39, 67, 0.4);
      z-index: 99998; align-items: center; justify-content: space-between;
      animation: subirBarra 0.35s ease-out; border: 1px solid rgba(255, 255, 255, 0.12);
      outline: none; user-select: none; -webkit-user-select: none;
    }
    @keyframes subirBarra {
      from { transform: translate(-50%, 40px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
    .bar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .bar-icon { width: 38px; height: 38px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
    .bar-text-group { min-width: 0; }
    .bar-title { 
      font-size: 13px; font-weight: 700; color: #ffffff; margin: 0; line-height: 1.2; 
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
    }
    .bar-sub { font-size: 11px; color: #F2B647; margin: 0; font-weight: 500; }
    .bar-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    
    .btn-bar-save { 
      position: relative;
      overflow: hidden;
      background: #E95042; color: #ffffff; border: none; font-size: 12px; 
      font-weight: 700; cursor: pointer; padding: 7px 15px; border-radius: 20px; 
      font-family: 'Poppins', sans-serif; transition: transform 0.1s ease;
      outline: none !important;
      -webkit-tap-highlight-color: transparent !important;
      user-select: none; -webkit-user-select: none;
    }
    .btn-bar-save:focus, .btn-bar-save:active {
      outline: none !important;
      -webkit-tap-highlight-color: transparent !important;
    }
    .btn-bar-save::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -120%;
      width: 55%;
      height: 200%;
      background: linear-gradient(
        120deg, 
        rgba(255, 255, 255, 0) 0%, 
        rgba(255, 255, 255, 0.42) 50%, 
        rgba(255, 255, 255, 0) 100%
      );
      transform: rotate(25deg);
      animation: brilloShimmerSave 3.2s infinite ease-in-out;
      pointer-events: none;
    }
    @keyframes brilloShimmerSave {
      0% { left: -120%; }
      25% { left: 160%; }
      100% { left: 160%; }
    }
    .btn-bar-save:active { transform: scale(0.95); }
    .btn-bar-close { 
      background: transparent; color: #9aa0a6; border: none; font-size: 16px; 
      cursor: pointer; padding: 4px; line-height: 1;
      outline: none !important;
      -webkit-tap-highlight-color: transparent !important;
      user-select: none; -webkit-user-select: none;
    }
    .btn-bar-close:focus, .btn-bar-close:active {
      outline: none !important;
      -webkit-tap-highlight-color: transparent !important;
    }

    /* MODAL DE GUÍA IOS */
    #iosGuideModal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(30, 39, 67, 0.72); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
      z-index: 99999; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-card {
      background: #ffffff; color: #1E2743; width: 90%; max-width: 310px;
      border-radius: 24px; padding: 24px 20px 20px 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      text-align: center; animation: zoomModal 0.22s ease-out;
    }
    @keyframes zoomModal {
      from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; }
    }
    .modal-logo {
      width: 76px; height: 76px; border-radius: 0; margin: 0 auto 12px auto;
      display: block; object-fit: contain;
    }
    .modal-title { 
      font-family: 'Unbounded', sans-serif; font-size: 15px; font-weight: 800; 
      color: #1E2743; margin: 0 0 16px 0; letter-spacing: -0.3px; line-height: 1.3;
    }
    .modal-instruction {
      background: #F9F9F9; border-radius: 16px; padding: 14px 16px; margin: 0 0 18px 0;
      text-align: center; font-size: 13px; color: #334155; line-height: 1.6; border: 1px solid #eef0f2;
    }
    .icon-inline {
      display: inline-flex; align-items: center; justify-content: center;
      vertical-align: middle; margin: 0 2px;
    }
    .modal-btn-ok {
      width: 100%; background: #E95042; color: #ffffff; border: none;
      padding: 13px; border-radius: 14px; font-family: 'Poppins', sans-serif;
      font-weight: 700; font-size: 13.5px; cursor: pointer; transition: transform 0.1s ease;
      box-shadow: 0 4px 12px rgba(233, 80, 66, 0.25);
      outline: none !important;
      -webkit-tap-highlight-color: transparent !important;
    }
    .modal-btn-ok:active { transform: scale(0.96); }
  </style>
</head>

  <script>
    var splashTerminado = false;
    function ocultarSplash() {
      if (splashTerminado) return;
      splashTerminado = true;
      var splash = document.getElementById("splashScreen");
      if (splash) {
        splash.style.opacity = "0";
        setTimeout(function() { splash.style.display = "none"; }, 400);
      }
    }

    setTimeout(ocultarSplash, 2200);

    var urlBase = "https://script.google.com/macros/s/AKfycbzQUgbqTUXLNHNpmufsJx_MYkkZdxa27kUmfNmP9fF5QsL3XuoQZWBn2_UCfVOU9RfEPQ/exec";
    var query = window.location.search || "";
    var tieneCredenciales = false;

    if (query && (query.indexOf('pin=') !== -1 || query.indexOf('search=') !== -1 || query.length > 5)) {
      if (query.indexOf('search=') === -1 && query.indexOf('action=') === -1) {
        query = '?search=' + query.substring(1);
      }
      tieneCredenciales = true;
    }

    function extraerCodParam(q) {
      if (!q) return '';
      var s = q;
      if (s.indexOf('?') !== -1) s = s.split('?')[1];
      var m = s.match(/(?:^|&)search=([^&]+)/i);
      if (m && m[1]) return decodeURIComponent(m[1]).toUpperCase().replace(/[^A-Z0-9]/g, '');
      var primer = s.split('&')[0];
      if (primer.indexOf('=') !== -1) {
        var p = primer.split('=');
        if (p[0].toLowerCase() === 'search') return decodeURIComponent(p[1]).toUpperCase().replace(/[^A-Z0-9]/g, '');
        return '';
      }
      return primer.toUpperCase().replace(/[^A-Z0-9]/g, '');
    }

    var codEntrante = extraerCodParam(query);
    var osInstancia = null;

    /* VINCULACIÓN ONE SIGNAL PUSH CON EL CÓDIGO DE CLIENTE */
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      osInstancia = OneSignal;
      await OneSignal.init({
        appId: "8a1a908c-8769-41bd-bc6b-d26fb0e6bf8e",
      });
      var codParaPush = codEntrante || (typeof codDueno !== 'undefined' ? codDueno : '');
      if (codParaPush) {
        await OneSignal.login(codParaPush);
      }

      // Si es iPhone y está instalado en pantalla de inicio
      if (esApple && esPWA) {
        try {
          var permisoAct = Notification.permission;
          if (permisoAct !== 'granted' && permisoAct !== 'denied') {
            var pill = document.getElementById('iosPushPill');
            if (pill) pill.style.display = 'inline-flex';
          }
        } catch(e) {}
      } else if (!esApple) {
        // En Android solicita automáticamente al cargar
        try {
          await OneSignal.Notifications.requestPermission();
        } catch(ePerm) {}
      }
    });

    async function activarPushIosClick() {
      var pill = document.getElementById('iosPushPill');
      if (pill) pill.style.display = 'none';
      if (osInstancia) {
        try {
          await osInstancia.Notifications.requestPermission();
        } catch(err) {}
      } else if ('Notification' in window) {
        try {
          await Notification.requestPermission();
        } catch(err) {}
      }
    }

    var querySinQR = query ? query.replace(/([&?])autoqr=[^&]*(&|$)/gi, '$1').replace(/[?&]$/, '') : '';

    /* ANCLAJE Y PROTECCIÓN DE LA TARJETA DEL DUEÑO */
    if (esPWA) {
      var duenoPwa = '';
      try { duenoPwa = localStorage.getItem('panarabe_pwa_owner') || localStorage.getItem('panarabe_final_query') || ''; } catch(e) {}
      var codDueno = extraerCodParam(duenoPwa);

      if (duenoPwa && codDueno) {
        if (codEntrante && codEntrante !== codDueno) {
          tieneCredenciales = true;
        } else if (query && query.indexOf('autoqr=1') !== -1) {
          query = duenoPwa + (duenoPwa.indexOf('autoqr=1') === -1 ? '&autoqr=1' : '');
          tieneCredenciales = true;
        } else {
          query = duenoPwa;
          tieneCredenciales = true;
        }
      } else if (tieneCredenciales) {
        try { 
          localStorage.setItem('panarabe_pwa_owner', querySinQR); 
          localStorage.setItem('panarabe_final_query', querySinQR); 
          localStorage.setItem('panarabe_app_instalada', '1');
        } catch(e) {}
      }
    } else {
      if (tieneCredenciales) {
        try { 
          var duenoActual = localStorage.getItem('panarabe_pwa_owner');
          if (!duenoActual) {
            localStorage.setItem('panarabe_pwa_owner', querySinQR);
            localStorage.setItem('panarabe_final_query', querySinQR);
          }
          sessionStorage.setItem('panarabe_session_query', query); 
        } catch(e) {}
      } else {
        try {
          var guardado = sessionStorage.getItem('panarabe_session_query') || localStorage.getItem('panarabe_pwa_owner') || localStorage.getItem('panarabe_final_query');
          if (guardado) {
            query = guardado;
            tieneCredenciales = true;
          }
        } catch(e) {}
      }
    }

    try {
      if (window.history && window.history.replaceState && window.location.search.indexOf('autoqr=1') !== -1) {
        var queryVisual = window.location.search.replace(/([&?])autoqr=1(&|$)/gi, '$1').replace(/[?&]$/, '');
        var pathLimpio = window.location.pathname + (queryVisual ? queryVisual : '');
        window.history.replaceState({}, document.title, pathLimpio);
      }
    } catch(e) {}

    var frame = document.getElementById("appFrame");
    frame.src = urlBase + (query ? query : "");

    frame.onload = function() {
      setTimeout(ocultarSplash, 350);

      try {
        var iframeDoc = frame.contentDocument || frame.contentWindow.document;
        var pinInput = iframeDoc.getElementById('inputPin');
        var btnIngresar = iframeDoc.getElementById('btnBuscar');
        
        if (pinInput && btnIngresar && query && query.indexOf('pin=') !== -1) {
          var matchPin = query.match(/pin=([^&]+)/i);
          if (matchPin && matchPin[1]) {
            var pinVal = decodeURIComponent(matchPin[1]);
            pinInput.value = pinVal;
            pinInput.dispatchEvent(new Event('input', { bubbles: true }));
            setTimeout(function() {
              btnIngresar.click();
            }, 150);
          }
        }
      } catch(err) {}
    };

    /* BOTÓN WHATSAPP */
    (function() {
      var btn = document.getElementById('btnWaFlotante');
      if (!btn) return;

      var estaAcoplado = false;
      var bloqueoApertura = false;
      var waBloqueoClick = false;
      var timerAuto7s = null;

      function iniciarTemporizador7s() {
        if (timerAuto7s) clearTimeout(timerAuto7s);
        timerAuto7s = setTimeout(guardarBoton, 7000);
      }

      function abrirWhatsAppSeguro() {
        if (waBloqueoClick || bloqueoApertura) return;
        waBloqueoClick = true;
        setTimeout(function() { waBloqueoClick = false; }, 1000);
        var targetUrl = 'https://api.whatsapp.com/send?phone=51906769744';
        if (esApple && esPWA) {
          window.location.href = targetUrl;
        } else {
          window.open(targetUrl, '_blank');
        }
      }

      function guardarBoton() {
        if (!estaAcoplado) {
          btn.classList.add('docked-edge');
          estaAcoplado = true;
        }
        if (timerAuto7s) clearTimeout(timerAuto7s);
      }

      function desplegarBoton() {
        btn.classList.remove('docked-edge');
        estaAcoplado = false;
        bloqueoApertura = true;
        setTimeout(function() { bloqueoApertura = false; }, 400);
        iniciarTemporizador7s();
      }

      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        if (estaAcoplado) {
          desplegarBoton();
          return;
        }
        if (!bloqueoApertura) {
          abrirWhatsAppSeguro();
        }
      });

      window.addEventListener('click', function(e) {
        if (!btn.contains(e.target)) {
          guardarBoton();
        }
      });

      window.addEventListener('touchstart', function(e) {
        if (!btn.contains(e.target)) {
          guardarBoton();
        }
      }, { passive: true });

      window.addEventListener('blur', function() {
        setTimeout(guardarBoton, 100);
      });

      iniciarTemporizador7s();
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').catch(function(){});
      });
    }

    var yaCerroGuardarSesion = false;
    try {
      yaCerroGuardarSesion = sessionStorage.getItem('pwa_barra_descartada') === '1';
    } catch(e) {}

    var estaInstalada = false;
    try {
      estaInstalada = localStorage.getItem('panarabe_app_instalada') === '1';
    } catch(e) {}

    /* APERTURA DIRECTA CON LA TARJETA DEL DUEÑO EN LA APP INSTALADA */
    function ejecutarAperturaPwa() {
      var queryDueno = '';
      try {
        queryDueno = localStorage.getItem('panarabe_pwa_owner') || localStorage.getItem('panarabe_final_query') || query || '';
      } catch(e) {}
      var destino = window.location.origin + window.location.pathname + (queryDueno ? queryDueno : '');
      var enlace = document.createElement('a');
      enlace.href = destino;
      enlace.target = '_blank';
      enlace.rel = 'noopener noreferrer';
      document.body.appendChild(enlace);
      enlace.click();
      document.body.removeChild(enlace);
    }

    function configurarBotonAbrirApp() {
      var barra = document.getElementById('pwaBarBottom');
      var btnInstalar = document.getElementById('btnBarInstall');
      var txtTit = barra ? barra.querySelector('.bar-title') : null;
      var txtSub = barra ? barra.querySelector('.bar-sub') : null;

      if (txtTit) txtTit.textContent = "Tarjeta Instalada";
      if (txtSub) txtSub.textContent = "Búscala como SP!";
      if (btnInstalar) {
        btnInstalar.textContent = "Abrir App";
        btnInstalar.onclick = ejecutarAperturaPwa;
      }
    }

    function configurarBotonGuardar(promptObj) {
      var barra = document.getElementById('pwaBarBottom');
      var btnInstalar = document.getElementById('btnBarInstall');
      var txtTit = barra ? barra.querySelector('.bar-title') : null;
      var txtSub = barra ? barra.querySelector('.bar-sub') : null;

      if (txtTit) txtTit.textContent = "Guardar Tarjeta";
      if (txtSub) txtSub.textContent = "Acceso directo a tu saldo";
      if (btnInstalar) {
        btnInstalar.textContent = "Guardar";
        btnInstalar.onclick = function() {
          if (promptObj) {
            promptObj.prompt();
            promptObj.userChoice.then(function(choice) {
              if (choice.outcome === 'accepted') {
                barra.style.display = 'none';
                try { sessionStorage.setItem('pwa_barra_descartada', '1'); } catch(e) {}
              }
            });
          }
        };
      }
    }

    if (!esPWA && tieneCredenciales) {
      var barra = document.getElementById('pwaBarBottom');
      var btnInstalar = document.getElementById('btnBarInstall');

      if (esApple) {
        if (!yaCerroGuardarSesion) {
          setTimeout(function() {
            barra.style.display = 'flex';
          }, 1200);

          btnInstalar.onclick = function() {
            document.getElementById('iosGuideModal').style.display = 'flex';
            barra.style.display = 'none';
            try { sessionStorage.setItem('pwa_barra_descartada', '1'); } catch(e) {}
          };
        }
      } else {
        if (estaInstalada) {
          configurarBotonAbrirApp();
          barra.style.display = 'flex';
        }

        var promptDiferido;
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          promptDiferido = e;
          estaInstalada = false;
          try { localStorage.removeItem('panarabe_app_instalada'); } catch(err) {}

          if (!yaCerroGuardarSesion) {
            configurarBotonGuardar(promptDiferido);
            barra.style.display = 'flex';
          } else {
            barra.style.display = 'none';
          }
        });
      }
    }

    function cerrarBarraClick() {
      var barra = document.getElementById('pwaBarBottom');
      if (barra) barra.style.display = 'none';
      try {
        if (!estaInstalada) {
          sessionStorage.setItem('pwa_barra_descartada', '1');
        }
      } catch(e) {}
    }
    var cerrarBarraDefinitivo = cerrarBarraClick;

    function cerrarGuiaIos() {
      document.getElementById('iosGuideModal').style.display = 'none';
      document.getElementById('pwaBarBottom').style.display = 'none';
      try { sessionStorage.setItem('pwa_barra_descartada', '1'); } catch(e) {}
    }

    window.addEventListener('appinstalled', function() {
      estaInstalada = true;
      try { 
        localStorage.setItem('panarabe_app_instalada', '1'); 
        if (querySinQR) {
          localStorage.setItem('panarabe_pwa_owner', querySinQR);
          localStorage.setItem('panarabe_final_query', querySinQR);
        }
      } catch(e) {}
      
      var barra = document.getElementById('pwaBarBottom');
      if (barra) {
        barra.style.display = 'none';
      }
    });
  </script>
</body>
</html>
