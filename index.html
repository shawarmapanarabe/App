<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SP!</title>
  
  <meta name="theme-color" content="#1E2743">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SP!">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/15GPc4cvy73xlL6Xl6reBbeCeF--LXDV1">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">

  <!-- CONEXIÓN SDK ONESIGNAL -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    var ONESIGNAL_APP_ID = "TU_ONESIGNAL_APP_ID_AQUI";
    OneSignalDeferred.push(async function(OneSignal) {
      if (ONESIGNAL_APP_ID && ONESIGNAL_APP_ID !== "TU_ONESIGNAL_APP_ID_AQUI") {
        await OneSignal.init({
          appId: ONESIGNAL_APP_ID,
          notifyButton: { enable: false }
        });
      }
    });
  </script>

  <script>
    var qInit = window.location.search;
    var esApple = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var esPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

    if (esApple && esPWA) {
      document.documentElement.classList.add('is-apple-installed');
    }

    if (esApple && !esPWA) {
      document.documentElement.classList.add('is-apple-web');
    }

    if (!esApple || !qInit || qInit.length < 4) {
      var mLink = document.createElement('link');
      mLink.rel = 'manifest';
      mLink.href = './manifest.json';
      document.head.appendChild(mLink);
    }
  </script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: #FFFFFF; font-family: 'Poppins', sans-serif;
      overscroll-behavior-y: none; -webkit-overscroll-behavior: none;
    }

    iframe { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      border: 0; display: block; background-color: #F9F9F9; 
    }

    html.is-apple-installed iframe {
      top: env(safe-area-inset-top, 0px) !important;
      height: calc(100% - env(safe-area-inset-top, 0px)) !important;
    }

    #iosTopBar {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: #FFFFFF;
      z-index: 99990;
    }
    html.is-apple-installed #iosTopBar {
      display: block;
      height: env(safe-area-inset-top, 0px);
    }

    /* BARRA SUPERIOR RETRÁCTIL */
    #notifBarTop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: #1E2743;
      color: #ffffff;
      z-index: 99995;
      padding: 10px 14px;
      box-shadow: 0 4px 16px rgba(30, 39, 67, 0.35);
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      box-sizing: border-box;
      border-bottom: 2px solid #F2B647;
    }
    html.is-apple-installed #notifBarTop {
      top: env(safe-area-inset-top, 0px);
    }

    .notif-content-area {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }
    .notif-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .notif-icon-tag {
      font-size: 15px;
      flex-shrink: 0;
    }
    .notif-title-text {
      font-size: 12.5px;
      font-weight: 700;
      color: #F2B647;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.25;
    }
    .notif-sub-text {
      display: none;
      font-size: 11px;
      color: #ffffff;
      opacity: 0.92;
      margin-top: 4px;
      line-height: 1.35;
      word-break: break-word;
    }
    .notif-btn-check {
      background: #E95042;
      color: #ffffff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(233, 80, 66, 0.4);
      transition: transform 0.1s ease;
      touch-action: manipulation;
    }
    .notif-btn-check:active { transform: scale(0.92); }

    /* MINI PÍLDORA CON REFLEJO BRILLANTE Y FUEGUITO 🔥 */
    #miniPildoraPromo {
      display: flex;
      position: fixed;
      top: 14px;
      right: 0;
      z-index: 99994;
      background: linear-gradient(135deg, #1E2743 0%, #2a375e 100%);
      border: 1.5px solid #F2B647;
      border-right: none;
      border-radius: 20px 0 0 20px;
      padding: 6px 14px 6px 10px;
      box-shadow: -2px 4px 12px rgba(30, 39, 67, 0.35);
      cursor: pointer;
      align-items: center;
      gap: 6px;
      transition: transform 0.18s ease, opacity 0.18s ease;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      opacity: 0.9;
      transform: translateX(0);
      overflow: hidden;
    }
    html.is-apple-installed #miniPildoraPromo {
      top: calc(14px + env(safe-area-inset-top, 0px));
    }
    #miniPildoraPromo:active {
      transform: scale(0.95);
      opacity: 1;
    }
    /* EFECTO DE REFLEJO SHIMMER EN LA PÍLDORA */
    #miniPildoraPromo::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -120%;
      width: 55%;
      height: 200%;
      background: linear-gradient(
        120deg, 
        rgba(255, 255, 255, 0) 0%, 
        rgba(255, 255, 255, 0.38) 50%, 
        rgba(255, 255, 255, 0) 100%
      );
      transform: rotate(25deg);
      animation: brilloPildora 3.5s infinite ease-in-out;
      pointer-events: none;
    }
    @keyframes brilloPildora {
      0% { left: -120%; }
      25% { left: 160%; }
      100% { left: 160%; }
    }
    .mini-pildora-txt {
      font-size: 11px;
      font-weight: 800;
      color: #F2B647;
      font-family: 'Poppins', sans-serif;
      letter-spacing: 0.3px;
    }

    /* MODAL DE FLYER */
    #modalFlyerPromo {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(30, 39, 67, 0.78);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 99999;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .flyer-card {
      background: #ffffff;
      border-radius: 24px;
      max-width: 360px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      animation: zoomFlyer 0.24s cubic-bezier(0.2, 0.8, 0.3, 1);
    }
    @keyframes zoomFlyer {
      from { transform: scale(0.88); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .flyer-img {
      width: 100%;
      height: auto;
      max-height: 58vh;
      object-fit: cover;
      display: block;
      background: #f8fafc;
    }
    .flyer-footer {
      padding: 16px 20px;
      background: #ffffff;
      text-align: center;
    }
    .flyer-tit {
      font-size: 16px;
      font-weight: 800;
      color: #1E2743;
      margin: 0 0 6px 0;
      line-height: 1.25;
    }
    .flyer-sub {
      font-size: 12px;
      color: #64748b;
      margin: 0 0 14px 0;
      line-height: 1.4;
    }
    .flyer-btn-close {
      width: 100%;
      background: #E95042;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      box-shadow: 0 4px 12px rgba(233, 80, 66, 0.3);
      touch-action: manipulation;
    }

    /* MODAL CLAVE MAESTRA */
    #modalClaveMaster {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(4px);
      z-index: 100001;
      align-items: center;
      justify-content: center;
      padding: 15px;
      box-sizing: border-box;
    }
    .clave-box {
      background: white;
      padding: 24px 20px;
      width: 100%;
      max-width: 340px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.2);
    }

    /* MODAL PANEL DE CAMPAÑAS (ADMIN) */
    #modalPanelPush {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(4px);
      z-index: 100000;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
    }
    .panel-push-card {
      background: #ffffff;
      padding: 22px 18px;
      width: 100%;
      max-width: 380px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      max-height: 92vh;
      overflow-y: auto;
      text-align: left;
    }
    .push-lbl {
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      display: block;
      margin-bottom: 3px;
    }
    .push-inp {
      width: 100%;
      padding: 10px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 12.5px;
      font-family: 'Poppins', sans-serif;
      box-sizing: border-box;
      margin-bottom: 10px;
      outline: none;
    }
    .push-preview-box {
      width: 100%;
      height: 120px;
      border: 1.5px dashed #cbd5e1;
      border-radius: 10px;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 12px;
      background: #f8fafc;
    }
    .push-preview-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* BOTÓN WHATSAPP FLOTANTE */
    #btnWaFlotante {
      display: flex;
      position: fixed;
      top: clamp(282px, 78vw, 335px);
      left: calc(50% + min(50vw, 215px) - 58px);
      z-index: 99990;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      text-decoration: none;
      transition: transform 0.28s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.28s ease, left 0.28s ease;
    }

    html.is-apple-web #btnWaFlotante {
      top: clamp(248px, 68vw, 305px);
    }

    html.is-apple-installed #btnWaFlotante {
      top: calc(clamp(282px, 78vw, 335px) + env(safe-area-inset-top, 0px));
    }

    #btnWaFlotante.docked-edge {
      left: calc(100% - 24px) !important;
      opacity: 0.65;
      transform: scale(0.92);
    }
    #btnWaFlotante.docked-edge:hover,
    #btnWaFlotante.docked-edge:active {
      opacity: 0.95;
    }

    .burbuja-wa-inner {
      width: 100%;
      height: 100%;
      background: #25D366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.45);
      border: 2px solid #ffffff;
      animation: palpitarWa 1.5s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .burbuja-wa-inner svg {
      width: 26px;
      height: 26px;
      fill: #ffffff;
    }
    @keyframes palpitarWa {
      0% { transform: scale(1); box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4); }
      100% { transform: scale(1.1); box-shadow: 0 6px 18px rgba(37, 211, 102, 0.7); }
    }

    /* PANTALLA SPLASH */
    #splashScreen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: #FFFFFF; z-index: 999999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.4s ease-out;
      pointer-events: none;
    }

    .splash-logo {
      width: 82vw;
      max-width: 360px;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      user-select: none;
      -webkit-user-select: none;
      animation: entrarYpalpitar 1.4s ease-in-out infinite alternate;
    }

    @keyframes entrarYpalpitar {
      0% { transform: scale(0.97); }
      100% { transform: scale(1.025); }
    }

    /* BARRA INFERIOR DE INSTALACIÓN */
    #pwaBarBottom {
      display: none; position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 32px); max-width: 380px; background: #1E2743; color: #ffffff;
      padding: 10px 14px; border-radius: 16px; box-shadow: 0 8px 24px rgba(30, 39, 67, 0.4);
      z-index: 99998; align-items: center; justify-content: space-between;
      animation: subirBarra 0.35s ease-out; border: 1px solid rgba(255, 255, 255, 0.12);
    }
    @keyframes subirBarra {
      from { transform: translate(-50%, 40px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
    .bar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .bar-icon { width: 38px; height: 38px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
    .bar-text-group { min-width: 0; }
    .bar-title { 
      font-size: 13px; font-weight: 700; color: #ffffff; margin: 0; line-height: 1.2; 
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
    }
    .bar-sub { font-size: 11px; color: #F2B647; margin: 0; font-weight: 500; }
    .bar-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    
    .btn-bar-save { 
      position: relative;
      overflow: hidden;
      background: #E95042; color: #ffffff; border: none; font-size: 12px; 
      font-weight: 700; cursor: pointer; padding: 7px 15px; border-radius: 20px; 
      font-family: 'Poppins', sans-serif; transition: transform 0.1s ease;
    }
    .btn-bar-save::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -120%;
      width: 55%;
      height: 200%;
      background: linear-gradient(
        120deg, 
        rgba(255, 255, 255, 0) 0%, 
        rgba(255, 255, 255, 0.42) 50%, 
        rgba(255, 255, 255, 0) 100%
      );
      transform: rotate(25deg);
      animation: brilloShimmerSave 3.2s infinite ease-in-out;
      pointer-events: none;
    }
    @keyframes brilloShimmerSave {
      0% { left: -120%; }
      25% { left: 160%; }
      100% { left: 160%; }
    }
    .btn-bar-save:active { transform: scale(0.95); }
    .btn-bar-close { background: transparent; color: #9aa0a6; border: none; font-size: 16px; cursor: pointer; padding: 4px; line-height: 1; }

    /* GUÍA IOS */
    #iosGuideModal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(30, 39, 67, 0.72); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
      z-index: 99999; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-card {
      background: #ffffff; color: #1E2743; width: 90%; max-width: 310px;
      border-radius: 24px; padding: 24px 20px 20px 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      text-align: center; animation: zoomModal 0.22s ease-out;
    }
    @keyframes zoomModal {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-logo {
      width: 76px; height: 76px; border-radius: 0; margin: 0 auto 12px auto;
      display: block; object-fit: contain;
    }
    .modal-title { 
      font-family: 'Unbounded', sans-serif; font-size: 15px; font-weight: 800; 
      color: #1E2743; margin: 0 0 16px 0; letter-spacing: -0.3px; line-height: 1.3;
    }
    .modal-instruction {
      background: #F9F9F9; border-radius: 16px; padding: 14px 16px; margin: 0 0 18px 0;
      text-align: center; font-size: 13px; color: #334155; line-height: 1.6; border: 1px solid #eef0f2;
    }
    .icon-inline {
      display: inline-flex; align-items: center; justify-content: center;
      vertical-align: middle; margin: 0 2px;
    }
    .modal-btn-ok {
      width: 100%; background: #E95042; color: #ffffff; border: none;
      padding: 13px; border-radius: 14px; font-family: 'Poppins', sans-serif;
      font-weight: 700; font-size: 13.5px; cursor: pointer; transition: transform 0.1s ease;
      box-shadow: 0 4px 12px rgba(233, 80, 66, 0.25);
    }
    .modal-btn-ok:active { transform: scale(0.96); }
  </style>
</head>
<body>

  <div id="iosTopBar"></div>

  <!-- BARRA DE NOTIFICACIÓN SUPERIOR -->
  <div id="notifBarTop">
    <div class="notif-content-area" onclick="alternarSubNotif()">
      <div class="notif-title-row">
        <span class="notif-icon-tag" id="notifIcon">🔥</span>
        <p class="notif-title-text" id="notifTitleTxt">Atento a tu siguiente promoción</p>
      </div>
      <div class="notif-sub-text" id="notifSubTxt"></div>
    </div>
    <button class="notif-btn-check" onclick="cerrarYColapsarNotif()">✓</button>
  </div>

  <!-- MINI PÍLDORA SUPERIOR DERECHA (CON FUEGUITO 🔥 Y REFLEJO) -->
  <div id="miniPildoraPromo">
    <span style="font-size:13.5px;line-height:1;">🔥</span>
    <span class="mini-pildora-txt" id="txtMiniPildora">Promo</span>
  </div>

  <!-- MODAL DE FLYER FLOTANTE -->
  <div id="modalFlyerPromo">
    <div class="flyer-card">
      <img id="imgFlyerPromo" class="flyer-img" src="" alt="Promoción">
      <div class="flyer-footer">
        <h3 id="titFlyerPromo" class="flyer-tit">¡Promoción Especial!</h3>
        <p id="subFlyerPromo" class="flyer-sub"></p>
        <button class="flyer-btn-close" onclick="cerrarModalFlyer()">¡Entendido!</button>
      </div>
    </div>
  </div>

  <!-- MODAL DE CLAVE MAESTRA -->
  <div id="modalClaveMaster">
    <div class="clave-box">
      <h3 style="margin:0 0 12px 0;color:#1e2743;font-size:17px;font-weight:800;">ADMINISTRACIÓN</h3>
      <input type="password" id="inputMasterPin" placeholder="Clave Maestra" maxlength="8" style="width:100%;padding:12px;border:2px solid #cbd5e1;border-radius:12px;font-size:18px;text-align:center;box-sizing:border-box;margin-bottom:14px;outline:none;">
      <div style="display:flex;gap:8px;">
        <button onclick="cerrarModalClave()" style="flex:1;background:#f1f5f9;color:#64748b;border:none;padding:12px;border-radius:12px;font-weight:700;cursor:pointer;">Atrás</button>
        <button id="btnSubmitMasterPin" onclick="validarPinRemoto()" style="flex:1;background:#1E2743;color:white;border:none;padding:12px;border-radius:12px;font-weight:700;cursor:pointer;">Ingresar</button>
      </div>
    </div>
  </div>

  <!-- MODAL PANEL DE CAMPAÑAS (ADMIN) -->
  <div id="modalPanelPush">
    <div class="panel-push-card">
      <h3 style="margin:0 0 12px 0;color:#1E2743;font-size:16px;font-weight:800;text-align:center;">CAMPAÑAS Y NOTIFICACIONES</h3>
      
      <label class="push-lbl">TÍTULO (MÁX. 1 LÍNEA):</label>
      <input type="text" id="inpCampTitulo" class="push-inp" maxlength="42" placeholder="Ej: ¡Hoy 2do shawarma a mitad de precio!">

      <label class="push-lbl">SUBTÍTULO / DETALLE (OPCIONAL):</label>
      <textarea id="inpCampSub" class="push-inp" rows="2" style="resize:none;" placeholder="Detalles de la promo al tocar el título..."></textarea>

      <label class="push-lbl">ENLACE DE IMAGEN / FLYER (GOOGLE DRIVE):</label>
      <input type="text" id="inpCampImgDrive" class="push-inp" oninput="procesarEnlaceDriveInput(this.value)" placeholder="Pega el link de Google Drive aquí...">
      
      <div id="previewBoxDrive" class="push-preview-box">
        <img id="imgPreviewDrive" class="push-preview-img" src="" alt="Vista previa">
      </div>
        <!-- BOTÓN FLOTANTE WHATSAPP -->
  <div id="btnWaFlotante" aria-label="WhatsApp">
    <div class="burbuja-wa-inner">
      <svg viewBox="0 0 32 32">
        <path d="M16 2C8.268 2 2 8.268 2 16c0 2.766.804 5.344 2.188 7.514L2.05 30.086l6.762-2.072A13.918 13.918 0 0 0 16 30c7.732 0 14-6.268 14-14S23.732 2 16 2zm0 25.6c-2.316 0-4.484-.666-6.318-1.814l-.452-.284-4.228 1.296 1.306-4.134-.294-.468A11.535 11.535 0 0 1 4.4 16c0-6.408 5.192-11.6 11.6-11.6s11.6 5.192 11.6 11.6-5.192 11.6-11.6 11.6zm6.368-8.718c-.348-.174-2.062-1.018-2.382-1.134-.32-.116-.552-.174-.784.174s-.9 1.134-1.104 1.366-.406.262-.754.088c-.348-.174-1.47-.542-2.8-1.728-1.036-.924-1.736-2.064-1.94-2.412-.204-.348-.022-.536.152-.71.156-.156.348-.406.522-.61.174-.204.232-.348.348-.58.116-.232.058-.436-.03-.61-.088-.174-.784-1.89-1.074-2.588-.282-.68-.57-.588-.784-.6l-.668-.012c-.232 0-.61.088-.93.436s-1.22 1.192-1.22 2.908 1.25 3.372 1.424 3.604c.174.232 2.458 3.754 5.956 5.262.832.36 1.482.574 1.988.736.836.266 1.596.228 2.198.138.67-.1 2.062-.842 2.352-1.656.29-.814.29-1.512.204-1.656-.088-.146-.32-.232-.668-.406z"/>
      </svg>
    </div>
  </div>

  <!-- PANTALLA SPLASH -->
  <div id="splashScreen">
    <img id="splashImg" src="https://lh3.googleusercontent.com/d/15GPc4cvy73xlL6Xl6reBbeCeF--LXDV1" class="splash-logo" alt="Shawarma Panárabe">
  </div>

  <iframe 
    id="appFrame" 
    name="appFrame" 
    src="" 
    allow="downloads; clipboard-write" 
  ></iframe>

  <!-- BARRA INFERIOR DE INSTALACIÓN -->
  <div id="pwaBarBottom">
    <div class="bar-left">
      <img src="https://lh3.googleusercontent.com/d/15GPc4cvy73xlL6Xl6reBbeCeF--LXDV1" class="bar-icon" alt="SP!">
      <div class="bar-text-group">
        <p class="bar-title">Guardar Tarjeta</p>
        <p class="bar-sub">Acceso directo a tu saldo</p>
      </div>
    </div>
    <div class="bar-right">
      <button class="btn-bar-save" id="btnBarInstall">Guardar</button>
      <button class="btn-bar-close" onclick="cerrarBarraDefinitivo()">✕</button>
    </div>
  </div>

  <!-- GUÍA IOS -->
  <div id="iosGuideModal">
    <div class="modal-card">
      <img src="https://lh3.googleusercontent.com/d/15GPc4cvy73xlL6Xl6reBbeCeF--LXDV1" class="modal-logo" alt="Shawarma Panárabe">
      <h3 class="modal-title">Guardar Tarjeta</h3>
      
      <div class="modal-instruction">
        En tu navegador, toca los tres puntos <b style="letter-spacing:1px;">•••</b>, elige <b>Compartir</b> 
        <span class="icon-inline">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1E2743" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
            <polyline points="16 6 12 2 8 6"></polyline>
            <line x1="12" y1="2" x2="12" y2="15"></line>
          </svg>
        </span>, 
        baja y busca <b>"Agregar a inicio"</b>.
      </div>
      
      <button class="modal-btn-ok" onclick="cerrarGuiaIos()">¡Entendido!</button>
    </div>
  </div>

  <script>
    var urlBase = "https://script.google.com/macros/s/AKfycbzQUgbqTUXLNHNpmufsJx_MYkkZdxa27kUmfNmP9fF5QsL3XuoQZWBn2_UCfVOU9RfEPQ/exec";
    var query = window.location.search;
    var tieneCredenciales = false;

    if (query && (query.indexOf('pin=') !== -1 || query.indexOf('search=') !== -1 || query.length > 5)) {
      if (query.indexOf('search=') === -1 && query.indexOf('action=') === -1) {
        query = '?search=' + query.substring(1);
      }
      tieneCredenciales = true;
      try { 
        localStorage.setItem('panarabe_final_query', query); 
        sessionStorage.setItem('panarabe_session_query', query);
      } catch(e) {}
    } else {
      try {
        var guardado = localStorage.getItem('panarabe_final_query') || sessionStorage.getItem('panarabe_session_query');
        if (guardado) {
          query = guardado;
          tieneCredenciales = true;
        }
      } catch(e) {}
    }

    var frame = document.getElementById("appFrame");
    frame.src = urlBase + (query ? query : "");

    function ocultarSplash() {
      var splash = document.getElementById("splashScreen");
      if (splash && splash.style.display !== "none") {
        splash.style.opacity = "0";
        setTimeout(function() {
          splash.style.display = "none";
        }, 400);
      }
    }

    frame.onload = function() {
      setTimeout(ocultarSplash, 400);

      try {
        var iframeDoc = frame.contentDocument || frame.contentWindow.document;
        var pinInput = iframeDoc.getElementById('inputPin');
        var btnIngresar = iframeDoc.getElementById('btnBuscar');
        
        if (pinInput && btnIngresar && query && query.indexOf('pin=') !== -1) {
          var matchPin = query.match(/pin=([^&]+)/i);
          if (matchPin && matchPin[1]) {
            var pinVal = decodeURIComponent(matchPin[1]);
            pinInput.value = pinVal;
            pinInput.dispatchEvent(new Event('input', { bubbles: true }));
            setTimeout(function() {
              btnIngresar.click();
            }, 150);
          }
        }
      } catch(err) {}
    };

    setTimeout(ocultarSplash, 4000);

    /* DETECCIÓN DE PROMOS Y MENSAJE POR DEFECTO */
    var campanaActivaMem = null;
    var imagenFlyerUrlMem = "";

    try {
      var cGuardada = localStorage.getItem('sp_campana_guardada');
      if (cGuardada) {
        campanaActivaMem = JSON.parse(cGuardada);
        if (campanaActivaMem && campanaActivaMem.exp) {
          if (new Date() > new Date(campanaActivaMem.exp)) {
            campanaActivaMem = null;
            localStorage.removeItem('sp_campana_guardada');
          }
        }
      }
    } catch(e) {}

    function extraerIdDrive(urlRaw) {
      if (!urlRaw) return "";
      var m = urlRaw.match(/[-\w]{25,}/);
      return m ? m[0] : "";
    }

    function procesarEnlaceDriveInput(val) {
      var id = extraerIdDrive(val);
      var box = document.getElementById('previewBoxDrive');
      var img = document.getElementById('imgPreviewDrive');
      if (id) {
        var urlLh3 = 'https://lh3.googleusercontent.com/d/' + id;
        img.src = urlLh3;
        box.style.display = 'flex';
      } else {
        box.style.display = 'none';
        img.src = '';
      }
    }

    function alternarSubNotif() {
      var sub = document.getElementById('notifSubTxt');
      if (sub && sub.textContent.trim().length > 0) {
        sub.style.display = (sub.style.display === 'block') ? 'none' : 'block';
      } else if (imagenFlyerUrlMem) {
        abrirModalFlyer();
      }
    }

    function mostrarNotifBar(icono, titulo, subtitulo, flyerUrl) {
      var bar = document.getElementById('notifBarTop');
      document.getElementById('notifIcon').textContent = icono || '🔥';
      document.getElementById('notifTitleTxt').textContent = titulo || '';
      var sub = document.getElementById('notifSubTxt');
      sub.textContent = subtitulo || '';
      sub.style.display = 'none';
      imagenFlyerUrlMem = flyerUrl || "";
      bar.style.display = 'flex';
      document.getElementById('miniPildoraPromo').style.display = 'none';
    }

    function cerrarYColapsarNotif() {
      document.getElementById('notifBarTop').style.display = 'none';
      document.getElementById('miniPildoraPromo').style.display = 'flex';
    }

    function responderToquePildora() {
      if (campanaActivaMem && campanaActivaMem.tit) {
        if (campanaActivaMem.img) {
          abrirModalFlyer();
        } else {
          mostrarNotifBar('🔥', campanaActivaMem.tit, campanaActivaMem.sub, '');
        }
      } else {
        var msgSinPromo = (campanaActivaMem && campanaActivaMem.sinPromo) 
          ? campanaActivaMem.sinPromo 
          : 'Atento a tu siguiente promoción';
        mostrarNotifBar('🔥', msgSinPromo, '', '');
      }
    }

    function abrirModalFlyer() {
      var img = imagenFlyerUrlMem || (campanaActivaMem ? campanaActivaMem.img : '');
      if (!img) return;
      document.getElementById('imgFlyerPromo').src = img;
      document.getElementById('titFlyerPromo').textContent = (campanaActivaMem && campanaActivaMem.tit) ? campanaActivaMem.tit : '¡Promoción Especial!';
      document.getElementById('subFlyerPromo').textContent = (campanaActivaMem && campanaActivaMem.sub) ? campanaActivaMem.sub : '';
      document.getElementById('modalFlyerPromo').style.display = 'flex';
    }

    function cerrarModalFlyer() {
      document.getElementById('modalFlyerPromo').style.display = 'none';
      cerrarYColapsarNotif();
    }

    /* SALDO DEL CLIENTE */
    window.addEventListener('message', function(ev) {
      if (!ev.data) return;
      if (ev.data.tipo === 'saldo_cliente') {
        var saldoActual = parseFloat(ev.data.saldo || 0);
        var saldoPrevio = parseFloat(localStorage.getItem('sp_saldo_previo') || '-1');
        var hoyIso = new Date().toISOString().slice(0, 10);

        if (saldoPrevio >= 0 && saldoActual > saldoPrevio && ev.data.diasRestantes > 0) {
          var ganancia = (saldoActual - saldoPrevio).toFixed(2);
          mostrarNotifBar('🎉', '¡Ganaste S/ ' + ganancia + ' hoy!', 'Saldo acumulado disponible en tu tarjeta.', '');
          localStorage.setItem('sp_fecha_aviso_saldo', hoyIso);
        }
        localStorage.setItem('sp_saldo_previo', String(saldoActual));
      }
    });

    /* CONTROL TÁCTIL PRECISO (POINTER EVENTS: PULSACIÓN 3s O TOQUE DIRECTO) */
    (function() {
      var pil = document.getElementById('miniPildoraPromo');
      var timerHold = null;
      var esPulsacionLarga = false;

      function onPointerDown(e) {
        esPulsacionLarga = false;
        timerHold = setTimeout(function() {
          esPulsacionLarga = true;
          if (navigator.vibrate) navigator.vibrate(60);
          abrirModalClave();
        }, 3000);
      }

      function onPointerUp(e) {
        if (timerHold) {
          clearTimeout(timerHold);
          timerHold = null;
        }
        if (!esPulsacionLarga) {
          responderToquePildora();
        }
      }

      function onPointerCancel() {
        if (timerHold) {
          clearTimeout(timerHold);
          timerHold = null;
        }
      }

      pil.addEventListener('pointerdown', onPointerDown);
      pil.addEventListener('pointerup', onPointerUp);
      pil.addEventListener('pointercancel', onPointerCancel);
    })();

    /* VALIDACIÓN DE CLAVE MAESTRA REMOTA SIN ERROR DE CONEXIÓN */
    function abrirModalClave() {
      document.getElementById('modalClaveMaster').style.display = 'flex';
      setTimeout(function(){ document.getElementById('inputMasterPin').focus(); }, 200);
    }

    function cerrarModalClave() {
      document.getElementById('modalClaveMaster').style.display = 'none';
      document.getElementById('inputMasterPin').value = '';
      var b = document.getElementById('btnSubmitMasterPin');
      b.disabled = false;
      b.textContent = 'Ingresar';
    }

    function validarPinRemoto() {
      var pin = document.getElementById('inputMasterPin').value.trim();
      if (!pin) {
        alert('Ingresa la clave');
        return;
      }

      var b = document.getElementById('btnSubmitMasterPin');
      b.disabled = true;
      b.textContent = 'Verificando...';

      // JSONP CALLBACK GLOBAL: Evita bloqueo de CORS en Apps Script
      var callbackName = 'cb_admin_' + Math.round(100000 * Math.random());
      window[callbackName] = function(res) {
        delete window[callbackName];
        if (scriptTag && scriptTag.parentNode) scriptTag.parentNode.removeChild(scriptTag);
        b.disabled = false;
        b.textContent = 'Ingresar';

        if (res && res.ok) {
          cerrarModalClave();
          abrirPanelPushAdmin();
        } else {
          alert('Clave maestra incorrecta');
          document.getElementById('inputMasterPin').value = '';
        }
      };

      var scriptTag = document.createElement('script');
      scriptTag.src = urlBase + '?action=validar_admin_pin&pin=' + encodeURIComponent(pin) + '&callback=' + callbackName;
      scriptTag.onerror = function() {
        delete window[callbackName];
        if (scriptTag && scriptTag.parentNode) scriptTag.parentNode.removeChild(scriptTag);
        b.disabled = false;
        b.textContent = 'Ingresar';
        alert('Error al validar con el servidor. Verifica tu conexión.');
      };
      document.body.appendChild(scriptTag);
    }

    function abrirPanelPushAdmin() {
      document.getElementById('modalPanelPush').style.display = 'flex';
      if (campanaActivaMem) {
        document.getElementById('inpCampTitulo').value = campanaActivaMem.tit || '';
        document.getElementById('inpCampSub').value = campanaActivaMem.sub || '';
        document.getElementById('inpCampImgDrive').value = campanaActivaMem.img || '';
        document.getElementById('inpCampExpiracion').value = campanaActivaMem.exp || '';
        document.getElementById('inpCampSinPromo').value = campanaActivaMem.sinPromo || 'Atento a tu siguiente promoción';
        if (campanaActivaMem.img) {
          procesarEnlaceDriveInput(campanaActivaMem.img);
        }
      }
    }

    function cerrarPanelPushAdmin() {
      document.getElementById('modalPanelPush').style.display = 'none';
    }

    function guardarYLanzarCampanaPush() {
      var tit = document.getElementById('inpCampTitulo').value.trim();
      var sub = document.getElementById('inpCampSub').value.trim();
      var dVal = document.getElementById('inpCampImgDrive').value.trim();
      var exp = document.getElementById('inpCampExpiracion').value;
      var sinP = document.getElementById('inpCampSinPromo').value.trim() || 'Atento a tu siguiente promoción';

      if (!tit) {
        alert('Ingresa el título de la campaña (máx. 1 línea)');
        return;
      }

      var idDrive = extraerIdDrive(dVal);
      var imgUrl = idDrive ? ('https://lh3.googleusercontent.com/d/' + idDrive) : '';

      campanaActivaMem = { tit: tit, sub: sub, img: imgUrl, exp: exp, sinPromo: sinP };
      try {
        localStorage.setItem('sp_campana_guardada', JSON.stringify(campanaActivaMem));
      } catch(e) {}

      mostrarNotifBar('🔥', tit, sub, imgUrl);
      cerrarPanelPushAdmin();
      alert('¡Campaña guardada con éxito!');
    }

    /* BOTÓN WHATSAPP AUTO-OCULTADO A LOS 5 SEGUNDOS */
    (function() {
      var btn = document.getElementById('btnWaFlotante');
      if (!btn) return;

      var estaAcoplado = false;
      var bloqueoApertura = false;
      var waBloqueoClick = false;
      var timerAutoOcultar = null;

      function iniciarTemporizador5s() {
        if (timerAutoOcultar) clearTimeout(timerAutoOcultar);
        timerAutoOcultar = setTimeout(function() {
          guardarBoton();
        }, 5000);
      }

      function abrirWhatsAppSeguro() {
        if (waBloqueoClick || bloqueoApertura) return;
        waBloqueoClick = true;
        setTimeout(function() { waBloqueoClick = false; }, 1000);
        var targetUrl = 'https://api.whatsapp.com/send?phone=51906769744';
        if (esApple && esPWA) {
          window.location.href = targetUrl;
        } else {
          window.open(targetUrl, '_blank');
        }
      }

      function guardarBoton() {
        if (!estaAcoplado) {
          btn.classList.add('docked-edge');
          estaAcoplado = true;
        }
        if (timerAutoOcultar) clearTimeout(timerAutoOcultar);
      }

      function desplegarBoton() {
        btn.classList.remove('docked-edge');
        estaAcoplado = false;
        bloqueoApertura = true;
        setTimeout(function() { bloqueoApertura = false; }, 400);
        iniciarTemporizador5s();
      }

      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        if (estaAcoplado) {
          desplegarBoton();
          return;
        }
        if (!bloqueoApertura) {
          abrirWhatsAppSeguro();
        }
      });

      window.addEventListener('click', function(e) {
        if (!btn.contains(e.target)) {
          guardarBoton();
        }
      });

      window.addEventListener('touchstart', function(e) {
        if (!btn.contains(e.target)) {
          guardarBoton();
        }
      }, { passive: true });

      window.addEventListener('blur', function() {
        setTimeout(guardarBoton, 100);
      });

      iniciarTemporizador5s();
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').catch(function(){});
      });
    }

    /* CONTROL DE INSTALACIÓN PWA */
    var yaCerroBarraSesion = false;
    try {
      yaCerroBarraSesion = sessionStorage.getItem('pwa_barra_descartada') === '1';
    } catch(e) {}

    if (!esPWA && tieneCredenciales && !yaCerroBarraSesion) {
      var barra = document.getElementById('pwaBarBottom');
      var btnInstalar = document.getElementById('btnBarInstall');

      if (esApple) {
        setTimeout(function() {
          barra.style.display = 'flex';
        }, 1200);

        btnInstalar.onclick = function() {
          document.getElementById('iosGuideModal').style.display = 'flex';
          barra.style.display = 'none';
          try { sessionStorage.setItem('pwa_barra_descartada', '1'); } catch(e) {}
        };
      } else {
        var promptDiferido;
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          promptDiferido = e;
          barra.style.display = 'flex';

          btnInstalar.onclick = function() {
            if (promptDiferido) {
              promptDiferido.prompt();
              promptDiferido.userChoice.then(function(choice) {
                if (choice.outcome === 'accepted') {
                  barra.style.display = 'none';
                  try { sessionStorage.setItem('pwa_barra_descartada', '1'); } catch(e) {}
                }
                promptDiferido = null;
              });
            }
          };
        });
      }
    }

    function cerrarBarraDefinitivo() {
      document.getElementById('pwaBarBottom').style.display = 'none';
      try { sessionStorage.setItem('pwa_barra_descartada', '1'); } catch(e) {}
    }

    function cerrarGuiaIos() {
      document.getElementById('iosGuideModal').style.display = 'none';
      document.getElementById('pwaBarBottom').style.display = 'none';
      try { sessionStorage.setItem('pwa_barra_descartada', '1'); } catch(e) {}
    }

    window.addEventListener('appinstalled', function() {
      document.getElementById('pwaBarBottom').style.display = 'none';
      try { sessionStorage.setItem('pwa_barra_descartada', '1'); } catch(e) {}
    });
  </script>
</body>
