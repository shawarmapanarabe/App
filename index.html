<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SP!</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1E2743">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SP!">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1yo4GNS2jeYfQC9-ZCTCbS13K-SxG-T91">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: #FFFFFF; font-family: 'Poppins', sans-serif;
      overscroll-behavior-y: none; -webkit-overscroll-behavior: none;
    }
    iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; display: block; opacity: 0; transition: opacity 0.3s ease; }
    
    /* Splash Screen con diseño institucional nativo (sin fallos de red en iOS) */
    #splashScreen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #FFFFFF; display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 99999;
      transition: opacity 0.4s ease;
    }
    .splash-box {
      width: 120px; height: 120px; background: #1E2743; border-radius: 28px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 12px 30px rgba(30,39,67,0.25); margin-bottom: 16px;
      animation: pulseLogo 1s infinite alternate;
    }
    .splash-box span {
      font-size: 42px; font-weight: 800; color: #F1C40F; letter-spacing: -1px;
    }
    .splash-title {
      font-size: 20px; font-weight: 800; color: #1E2743; margin: 0; letter-spacing: 0.5px;
    }
    .splash-sub {
      font-size: 11px; font-weight: 700; color: #e95042; margin-top: 4px; letter-spacing: 1px;
    }
    @keyframes pulseLogo {
      from { transform: scale(0.95); }
      to { transform: scale(1.05); }
    }

    #pwaBarBottom {
      display: none; position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 28px); max-width: 400px; background: #202124; color: #ffffff;
      padding: 10px 14px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 99998; align-items: center; justify-content: space-between;
    }
    .bar-left { display: flex; align-items: center; gap: 10px; }
    .bar-icon { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; }
    .bar-title { font-size: 13.5px; font-weight: 700; color: #ffffff; margin: 0; line-height: 1.2; }
    .bar-sub { font-size: 11px; color: #9aa0a6; margin: 0; }
    .bar-right { display: flex; align-items: center; gap: 8px; }
    .btn-bar-install { background: #8ab4f8; color: #202124; border: none; font-size: 12.5px; font-weight: 700; cursor: pointer; padding: 7px 14px; border-radius: 20px; }
    .btn-bar-close { background: transparent; color: #9aa0a6; border: none; font-size: 16px; cursor: pointer; padding: 4px; line-height: 1; }
    #iosGuideModal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.65); backdrop-filter: blur(4px); z-index: 99999;
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal-card {
      background: #ffffff; color: #1E2743; width: 100%; max-width: 330px;
      border-radius: 20px; padding: 22px 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); text-align: center;
    }
    .modal-title { font-size: 16px; font-weight: 800; margin: 10px 0 8px 0; }
    .modal-step {
      font-size: 13px; color: #334155; text-align: left; margin: 10px 0;
      background: #f8fafc; padding: 12px 14px; border-radius: 12px; line-height: 1.45; display: flex; align-items: center; gap: 10px;
    }
    .modal-btn-ok { margin-top: 14px; width: 100%; background: #e95042; color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 13.5px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Pantalla de carga nativa garantizada sin retrasos de red -->
  <div id="splashScreen">
    <div class="splash-box">
      <span>SP!</span>
    </div>
    <h1 class="splash-title">PANARABE</h1>
    <p class="splash-sub">TARJETA PREFERENTE</p>
  </div>

  <iframe id="appFrame" name="appFrame" src="" allow="downloads; clipboard-write" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads allow-top-navigation-by-user-activation" onload="document.getElementById('splashScreen').style.opacity='0'; setTimeout(function(){ document.getElementById('splashScreen').style.display='none'; document.getElementById('appFrame').style.opacity='1'; }, 350);"></iframe>

  <div id="pwaBarBottom">
    <div class="bar-left">
      <img src="https://lh3.googleusercontent.com/d/1yo4GNS2jeYfQC9-ZCTCbS13K-SxG-T91" class="bar-icon" alt="SP!">
      <div>
        <p class="bar-title">Instalar Tarjeta</p>
        <p class="bar-sub">Acceso directo a tu saldo</p>
      </div>
    </div>
    <div class="bar-right">
      <button class="btn-bar-install" id="btnBarInstall">Instalar</button>
      <button class="btn-bar-close" onclick="cerrarBarra()">✕</button>
    </div>
  </div>

  <div id="iosGuideModal">
    <div class="modal-card">
      <img src="https://lh3.googleusercontent.com/d/1yo4GNS2jeYfQC9-ZCTCbS13K-SxG-T91" style="width: 50px; height: 50px; border-radius: 12px;" alt="Logo">
      <h3 class="modal-title">Instalar en tu iPhone</h3>
      <div class="modal-step">
        <span><b>1.</b> Toca el botón <b>Compartir</b> en la barra inferior de Safari.</span>
      </div>
      <div class="modal-step">
        <span><b>2.</b> Desliza y selecciona <b>"Agregar a Inicio"</b>.</span>
      </div>
      <button class="modal-btn-ok" onclick="cerrarGuiaIos()">¡Entendido!</button>
    </div>
  </div>

  <script>
    var urlBase = "https://script.google.com/macros/s/AKfycbzQUgbqTUXLNHNpmufsJx_MYkkZdxa27kUmfNmP9fF5QsL3XuoQZWBn2_UCfVOU9RfEPQ/exec";
    var query = window.location.search;

    if (query && query.length > 1 && query.indexOf('app_in_frame') === -1) {
      if (query.indexOf('search=') === -1 && query.indexOf('action=') === -1) {
        query = '?search=' + query.substring(1);
      }
      try { localStorage.setItem('panarabe_last_query', query); } catch(e) {}
    } else {
      try {
        var guardado = localStorage.getItem('panarabe_last_query');
        if (guardado) { query = guardado; }
      } catch(e) {}
    }

    var queryFinal = (query && query.indexOf('app_in_frame') === -1 && query.length > 3) ? query : "";
    var urlFinalIframe = urlBase + queryFinal + (queryFinal ? "&" : "?") + "app_in_frame=1";

    var frame = document.getElementById("appFrame");
    frame.src = urlFinalIframe;

    var esPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (!esPWA) {
      var esIphone = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var barra = document.getElementById('pwaBarBottom');
      var btnInstalar = document.getElementById('btnBarInstall');
      if (esIphone) {
        setTimeout(function() { barra.style.display = 'flex'; }, 1200);
        btnInstalar.onclick = function() { document.getElementById('iosGuideModal').style.display = 'flex'; };
      }
    }

    function cerrarBarra() { document.getElementById('pwaBarBottom').style.display = 'none'; }
    function cerrarGuiaIos() { 
      document.getElementById('iosGuideModal').style.display = 'none'; 
      document.getElementById('pwaBarBottom').style.display = 'none'; 
    }
  </script>
</body>
</html>
